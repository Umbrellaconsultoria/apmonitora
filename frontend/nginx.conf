server {
    listen 80;
    server_name _;

    # Redirecionar todo o tráfego HTTP para HTTPS para garantir o uso da câmera nos tablets
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # Certificados SSL/TLS (Gerados automaticamente ou fornecidos via volume)
    ssl_certificate /etc/nginx/certs/apmonitora.crt;
    ssl_certificate_key /etc/nginx/certs/apmonitora.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Frontend Single Page App / PWA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy para rotas da API Backend Node.js
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy para arquivos de uploads estáticos
    location /uploads/ {
        proxy_pass http://backend:3001/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Proxy para WebSockets do Socket.io
    location /socket.io/ {
        proxy_pass http://backend:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Proxy para o microserviço Python de Visão Computacional
    location /face/ {
        proxy_pass http://face-service:8000/face/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
